# =========================================================================
# Docker Compose: Development Environment
# Usage: docker compose up --build
# =========================================================================

version: '3.8'

services:
  portal-dev:
    container_name: esocs-ordination-portal-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # Bind mounts for hot reloading
      - ./src:/app/src
      - ./public:/app/public
      - ./data:/app/data
      - ./next.config.ts:/app/next.config.ts
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      # Prevent host node_modules from overwriting container node_modules
      - portal_dev_node_modules:/app/node_modules
      - portal_dev_next:/app/.next
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  portal_dev_node_modules:
    name: esocs_portal_dev_node_modules
  portal_dev_next:
    name: esocs_portal_dev_next

