# =========================================================================
# Docker Compose: Development Environment (Live Instant Hot-Reloading)
# Usage: docker compose up -d --build
# =========================================================================

services:
  portal-dev:
    container_name: esocs-ordination-portal-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=development
      - PORT=3010
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      # Enable real-time file watcher polling across host-container boundary
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500
      - FAST_REFRESH=true
      - WDS_SOCKET_PORT=3010
    volumes:
      # Live bind mount for the entire workspace
      - .:/app:delegated
      # Isolated volume for container node_modules
      - portal_dev_node_modules:/app/node_modules
      # Isolated volume for container .next runtime cache
      - portal_dev_next_cache:/app/.next
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  portal_dev_node_modules:
    name: esocs_portal_dev_node_modules
  portal_dev_next_cache:
    name: esocs_portal_dev_next_cache