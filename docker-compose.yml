# =========================================================================
# Docker Compose: Development Environment (Live Instant Hot-Reloading)
# Usage: docker compose up --build
# =========================================================================

services:
  portal-dev:
    container_name: esocs-ordination-portal-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      # Enable real-time file watcher polling across host-container boundary
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500
      - FAST_REFRESH=true
      - WDS_SOCKET_PORT=3000
    volumes:
      # Live bind mount for the entire workspace (all file edits sync instantly)
      - .:/app:delegated
      # Isolated volume for container node_modules preventing host overrides
      - portal_dev_node_modules:/app/node_modules
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  portal_dev_node_modules:
    name: esocs_portal_dev_node_modules
