# =========================================================================
# Docker Compose: Production Environment
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# =========================================================================

services:
  portal-prod:
    container_name: esocs-ordination-portal-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      # Persistent storage for canonical records database
      - portal_prod_data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  portal_prod_data:
    name: esocs_portal_prod_data

